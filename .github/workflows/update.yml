name: 'Automated Foot Flatpak CI/CD'

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 5 * * *' # Runs daily at 5 AM UTC

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.check.outputs.update }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-tags: 'true'

      - name: "Fetch Latest Foot Tag"
        id: repo
        run: |
          REPO="https://codeberg.org/dnkl/foot.git"
          REG="^v?(\d+\.\d+\.\d+)$"
          VERSION=$(git ls-remote --tags --sort="-version:refname" $REPO | grep -v '{}$' | awk -F '/' '{print $3}' | grep -E $REG | head -n 1)
          echo "Latest Chrome Version Found: $VERSION"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: "Check For Version Tag"
        id: check
        run: |
          VERSION=${{ steps.repo.outputs.version }}
          if git ls-remote --exit-code --tags origin ${VERSION}; then
            echo "Tag for version ${LATESTVERSION_TAG} already exists. No update needed."
            echo "update=false" >> $GITHUB_OUTPUT
          else
            echo "New version ${LATESTVERSION_TAG} detected. Proceeding with build."
            echo "update=true" >> $GITHUB_OUTPUT
          fi

  update:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    needs: check
    if: needs.check.outputs.update == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v5
        with:
          ref: main
          path: main

      - name: "Update Manifest"
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        with:
          args: --edit-only /github/workspace/main/org.codeberg.dnkl.foot.yaml

      - name: 'Import GPG Key'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: "Check Flatpak Branch"
        id: flatpak
        run: |
          if git -C main ls-remote --exit-code --branches origin flatpak; then
            echo "Flatpak branch already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Flatpak branch doesn't exist."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Checkout Flatpak Repository For Update"
        if: steps.flatpak.outputs.exists == 'true'
        uses: actions/checkout@v5
        with:
          ref: flatpak
          path: flatpak
          fetch-depth: 0
          lfs: true

      - name: "Checkout Repository For Flatpak Creation"
        if: steps.flatpak.outputs.exists == 'false'
        uses: actions/checkout@v5
        with:
          path: flatpak


      - name: "Init Flatpak Repository"
        if: steps.flatpak.outputs.exists == 'false'
        run: |
          git -C flatpak switch --orphan flatpak
          cp main/.gitattributes flatpak/
          git -C flatpak lfs install
          git -C flatpak lfs track "**/objects/**"

      - name: "Update Flatpak Tools & Ensure PATH"
        run: |
          # Update flatpak itself first
          flatpak update --appstream -y
          flatpak update -y # Update runtime/apps including potentially flatpak itself

          # Install the latest Builder from Flathub
          flatpak install flathub org.flatpak.Builder -y

          # Find the path to the newly installed builder
          FLATPAK_BUILDER_PATH=$(flatpak info --location org.flatpak.Builder)/export/bin/flatpak-builder
          echo "Using flatpak-builder at: $FLATPAK_BUILDER_PATH"

          # Prepend the Builder's bin directory to the PATH for subsequent steps
          echo "$(dirname $FLATPAK_BUILDER_PATH)" >> $GITHUB_PATH

          # Verify versions
          echo "Flatpak version:"
          flatpak --version
          echo "Flatpak-builder version:"
          $FLATPAK_BUILDER_PATH --version # Call the specific builder path

      - name: "Build Flatpak"
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          VERSION=${{ needs.check.outputs.version }}
          flatpak-builder --repo=flatpak --force-clean --disable-rofiles-fuse --gpg-sign="$GPG_KEY_ID" \
            --subject="Update foot to ${VERSION}" build-dir main/org.codeberg.dnkl.foot.yaml

      - name: "Create / Update foot.flatpakrepo"
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          {
            echo "[Flatpak Repo]";
            echo "Title=Foot (Unofficial)";
            echo "Url=${REPO_URL}";
            echo "GPGKey=$(gpg --export $GPG_KEY_ID | base64 | tr -d '\n')";
          } > "flatpak/foot.flatpakrepo"

      - name: "Ensure ostree refs/remotes directory exists"
        run: mkdir -p flatpak/refs/remotes

      - name: "Sign Flatpak Repository Summary"
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: flatpak build-update-repo --gpg-sign="$GPG_KEY_ID" --prune flatpak

      - name: 'Setup Pages'
        uses: actions/configure-pages@v4

      - name: 'Upload Repository as Artifact'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./flatpak

      - name: 'Deploy to GitHub Pages'
        uses: actions/deploy-pages@v4

      - name: "Configure Git"
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: "Publish Flatpak Repositry"
        run: |
          VERSION=${{ needs.check.outputs.version }}
          if [ -z "$(git -C flatpak status --porcelain)" ]; then
            echo "✅ No changes to commit."
          else
            git -C flatpak add .
            git -C flatpak commit -m "Deploy foot version ${VERSION}"
            git -C flatpak push origin flatpak
          fi
          git -C flatpak tag "deploy-${VERSION}"
          git -C flatpak push origin "deploy-${VERSION}"

      - name: "Commit Manifest And Tag Main Branch"
        run: |
          VERSION=${{ needs.check.outputs.version }}
          if [ -z "$(git -C main status --porcelain)" ]; then
            echo "✅ No changes to commit."
          else
            git -C main add org.codeberg.dnkl.foot.yaml org.codeberg.dnkl.foot.metainfo.xml
            git -C main commit -m "Update foot to version ${VERSION}"
            git -C main push
          fi
          git -C main tag "${VERSION}"
          git -C main push --tags
